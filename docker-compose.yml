version: '3.8'

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  app1:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - redis

  app2:
    build: .
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - redis